    statesDatabase[state].forEach(city => list.push(`${city} (${state})`));
  }
  return list;
}

function navigate(view) {
  currentView = view;
  activeParam = null;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openStateDetail(stateName) {
  currentView = "state-detail";
  activeParam = stateName;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openCityDetail(stateName, cityName) {
  currentView = "city-detail";
  activeParam = { state: stateName, city: cityName };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openBlogDetail(blogId) {
  currentView = "blog-detail";
  activeParam = blogId;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function createHubCard(title, items, viewAllText, targetView, theme, iconName, isStateCard) {
  const isRose = theme === "rose";
  const accentBg = isRose ? "bg-gradient-to-tr from-rose-600 to-pink-500" : "bg-gradient-to-tr from-indigo-600 to-blue-500";
  const footerStyle = isRose ? "bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border-t border-rose-500/20" : "bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 border-t border-indigo-500/20";

  return `
    <div class="glass-card rounded-3xl shadow-xl relative flex flex-col justify-between overflow-visible pt-12 group mt-6">
      <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl ${accentBg} text-white group-hover:scale-110 transition-transform ring-4 ring-slate-950">
        <i data-lucide="${iconName}" class="w-7 h-7"></i>
      </div>
      <div class="px-5 pb-4">
        <div class="text-center mb-4 mt-1">
          <h3 class="font-extrabold tracking-wider text-[11px] text-slate-200">${title}</h3>
          <div class="w-8 h-1 mx-auto mt-1.5 rounded-full ${accentBg}"></div>
        </div>
        <ul class="space-y-2 text-xs text-slate-300">
          ${items.slice(0, 6).map(item => `
            <li ${isStateCard ? `onclick="openStateDetail('${item}')"` : ""} class="flex items-center justify-between p-2 rounded-xl glass-item ${isStateCard ? "cursor-pointer group/item" : ""}">
              <div class="flex items-center truncate pr-1">
                <span class="text-indigo-400 mr-1.5 font-bold text-xs">›</span>
                <span class="truncate text-slate-300 ${isStateCard ? "group-hover/item:text-indigo-300 font-medium" : ""}">${item}</span>
              </div>
              ${isStateCard ? '<i data-lucide="chevron-right" class="w-3 h-3 text-slate-500 group-hover/item:text-indigo-400 shrink-0"></i>' : ""}
            </li>
          `).join("")}
        </ul>
      </div>
      <div onclick="navigate('${targetView}')" class="px-5 py-3.5 cursor-pointer flex items-center justify-between text-[11px] font-bold uppercase tracking-wider transition-colors ${footerStyle} rounded-b-3xl">
        <span>${viewAllText}</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </div>
    </div>
  `;
}

function createBlogHubCard() {
  return `
    <div class="glass-card rounded-3xl shadow-xl relative flex flex-col justify-between overflow-visible pt-12 group mt-6">
      <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl bg-gradient-to-tr from-amber-600 to-orange-500 text-white group-hover:scale-110 transition-transform ring-4 ring-slate-950">
        <i data-lucide="book-open" class="w-7 h-7"></i>
      </div>
      <div class="px-5 pb-4">
        <div class="text-center mb-4 mt-1">
          <h3 class="font-extrabold tracking-wider text-[11px] text-slate-200">LATEST BLOGS & GUIDES</h3>
          <div class="w-8 h-1 mx-auto mt-1.5 rounded-full bg-gradient-to-tr from-amber-600 to-orange-500"></div>
        </div>
        <div class="space-y-2.5">
          ${blogPosts.map(blog => `
            <div onclick="openBlogDetail(${blog.id})" class="p-2.5 rounded-xl glass-item hover:border-amber-500/50 cursor-pointer group/blog">
              <span class="text-[9px] font-bold text-amber-400 uppercase tracking-wider">${blog.category}</span>
              <h4 class="text-[11px] font-bold text-slate-200 group-hover/blog:text-amber-300 mt-0.5">${blog.title}</h4>
            </div>
          `).join("")}
        </div>
      </div>
      <div onclick="navigate('blogs-page')" class="px-5 py-3.5 cursor-pointer flex items-center justify-between text-[11px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 border-t border-amber-500/20 rounded-b-3xl transition-colors">
        <span>All Expert Guides</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </div>
    </div>
  `;
}

function createListView(title, data, iconName, type) {
  return `
    <div class="max-w-5xl mx-auto glass-panel rounded-3xl shadow-2xl p-5 md:p-10 animate-page">
      <button onclick="navigate('home')" class="flex items-center text-xs font-bold text-slate-300 hover:text-indigo-400 mb-6 transition-colors glass-item px-4 py-2 rounded-xl w-fit cursor-pointer">
        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Main Dashboard
      </button>
      <div class="flex items-center space-x-4 border-b border-slate-800 pb-5 mb-6">
        <div class="p-3 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-2xl shrink-0">
          <i data-lucide="${iconName}" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="text-indigo-400 text-[10px] font-bold uppercase tracking-wider">Comprehensive Directory</span>
          <h1 class="text-lg md:text-2xl font-extrabold text-white mt-0.5">${title}</h1>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-[62vh] overflow-y-auto pr-2">
        ${data.map(item => `
          <div ${type === "state" ? `onclick="openStateDetail('${item}')"` : ""} class="glass-item p-3.5 rounded-2xl hover:border-indigo-500/50 transition-all ${type === "state" ? "cursor-pointer" : ""} flex items-center justify-between group">
            <div class="truncate pr-2">
              <span class="text-xs font-bold text-slate-200 group-hover:text-indigo-300 block truncate">${item}</span>
              <span class="text-[10px] text-slate-400 block truncate">${type === "state" ? `GeM Portal Service Provider in ${item}` : type === "city" ? "GeM Portal Registration & Services Provider Consultant" : "GeM Portal Consultancy"}</span>
            </div>
            ${type === "state" ? `
              <div class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center shrink-0 group-hover:bg-indigo-500/20 group-hover:text-indigo-400 transition-colors">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500 group-hover:text-indigo-400"></i>
              </div>
            ` : ""}
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function createBlogListView() {
  return `
    <div class="max-w-4xl mx-auto glass-panel rounded-3xl shadow-2xl p-5 md:p-10 animate-page">
      <button onclick="navigate('home')" class="flex items-center text-xs font-bold text-slate-300 hover:text-amber-400 mb-6 transition-colors glass-item px-4 py-2 rounded-xl w-fit cursor-pointer">
        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Main Dashboard
      </button>
      <div class="flex items-center space-x-4 border-b border-slate-800 pb-5 mb-8">
        <div class="p-3 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-2xl">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="text-amber-400 text-[10px] font-bold uppercase tracking-wider">Expert Knowledge Base</span>
          <h1 class="text-lg md:text-2xl font-extrabold text-white mt-0.5">GeM Portal Consultancy Articles & Guides</h1>
        </div>
      </div>
      <div class="space-y-4 max-h-[62vh] overflow-y-auto pr-2">
        ${blogPosts.map(blog => `
          <div onclick="openBlogDetail(${blog.id})" class="glass-item p-5 rounded-2xl hover:border-amber-500/50 transition-all cursor-pointer group">
            <div class="flex items-center justify-between mb-1.5">
              <span class="bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">${blog.category}</span>
              <span class="text-[11px] text-slate-400"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${blog.readTime}</span>
            </div>
            <h2 class="text-base font-bold text-white group-hover:text-amber-400 transition-colors mb-1.5">${blog.title}</h2>
            <p class="text-slate-400 text-xs mb-3 leading-relaxed">${blog.excerpt}</p>
            <div class="flex items-center text-[11px] font-bold text-amber-400 group-hover:translate-x-1 transition-transform">
              Read Full Article <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1"></i>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  if (!app) return;

  if (currentView === "home") {
    app.innerHTML = `
      <div class="text-center mb-14 animate-page">
        <span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-extrabold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-lg shadow-indigo-500/10">
          ⭐ India's #1 Certified GeM Consultancy Network
        </span>
        <h1 class="text-2xl md:text-5xl font-extrabold text-white mt-4 tracking-tight">
          Best GeM Portal Consultant & Service Provider
        </h1>
        <p class="text-slate-400 mt-2.5 max-w-2xl mx-auto text-xs md:text-sm leading-relaxed">
          Looking for expert assistance? Explore state-wise consultants, 200+ major city service providers, specialized bidding solutions, and professional guidance across India.
        </p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 pb-12 animate-page">
        ${createHubCard("STATE CONSULTANTS", Object.keys(statesDatabase), "Explore All 25+ States", "states-page", "indigo", "map-pin", true)}
        ${createHubCard("CITY CONSULTANTS", getAllCitiesFlat().slice(0, 8), "Explore 200+ Cities", "cities-page", "rose", "building-2", false)}
        ${createHubCard("SERVICE PROVIDERS", keywordServices.slice(0, 8), "All GeM Services", "services-page", "blue", "tag", false)}
        ${createBlogHubCard()}
      </div>
    `;
  } else if (currentView === "states-page") {
    app.innerHTML = createListView("Best GeM Portal Consultant & Service Provider in All States", Object.keys(statesDatabase), "map-pin", "state");
  } else if (currentView === "cities-page") {
    app.innerHTML = createListView("Best GeM Portal Consultant & Service Provider in 200+ Cities", getAllCitiesFlat(), "building-2", "city");
  } else if (currentView === "services-page") {
    app.innerHTML = createListView("Specialized GeM Portal Consultancy Services & Keywords", keywordServices, "tag", "service");
  } else if (currentView === "blogs-page") {
    app.innerHTML = createBlogListView();
  } else if (currentView === "state-detail") {
    const stateName = activeParam;
    const cities = statesDatabase[stateName] || [];
    app.innerHTML = `
      <div class="max-w-4xl mx-auto glass-panel rounded-3xl shadow-2xl p-5 md:p-10 animate-page">
        <button onclick="navigate('states-page')" class="flex items-center text-xs font-bold text-slate-300 hover:text-indigo-400 mb-6 transition-colors glass-item px-4 py-2 rounded-xl w-fit cursor-pointer">
          <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to States Directory
        </button>
        <div class="flex items-center space-x-4 border-b border-slate-800 pb-5 mb-6">
          <div class="p-3 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-2xl">
            <i data-lucide="map-pin" class="w-7 h-7"></i>
          </div>
          <div>
            <span class="text-indigo-400 text-[11px] font-bold uppercase tracking-wider">State Region Hub</span>
            <h1 class="text-xl md:text-2xl font-extrabold text-white mt-0.5">Best GeM Portal Consultant & Service Provider in ${stateName}</h1>
            <p class="text-xs text-slate-400 mt-1">Select any city below to connect with local GeM bidding and registration experts.</p>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 max-h-[60vh] overflow-y-auto pr-2">
          ${cities.map(city => `
            <div onclick="openCityDetail('${stateName}', '${city}')" class="glass-item p-3.5 rounded-2xl hover:border-indigo-500/50 transition-all cursor-pointer flex items-center justify-between group">
              <div class="truncate pr-2">
                <span class="text-xs font-bold text-slate-200 group-hover:text-indigo-300 block truncate">${city} GeM Consultancy</span>
                <span class="text-[10px] text-slate-400 block truncate">Best GeM Portal Consultant in ${city}</span>
              </div>
              <div class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center shrink-0 group-hover:bg-indigo-500/20 group-hover:text-indigo-400 transition-colors">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500 group-hover:text-indigo-400"></i>
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  } else if (currentView === "city-detail") {
    const { state, city } = activeParam;
    app.innerHTML = `
      <div class="max-w-3xl mx-auto glass-panel rounded-3xl shadow-2xl p-6 md:p-10 animate-page">
        <button onclick="openStateDetail('${state}')" class="flex items-center text-xs font-bold text-slate-300 hover:text-indigo-400 mb-6 transition-colors glass-item px-4 py-2 rounded-xl w-fit cursor-pointer">
          <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to ${state} Cities
        </button>
        <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold px-3.5 py-1 rounded-full uppercase tracking-wider">Verified Regional Hub</span>
        <h1 class="text-xl md:text-3xl font-extrabold text-white mt-4 mb-2">Best GeM Portal Consultant & Service Provider in ${city}, ${state}</h1>
      </div>
    `;
  } else if (currentView === "blog-detail") {
    const blog = blogPosts.find(b => b.id === activeParam);
    app.innerHTML = `
      <div class="max-w-3xl mx-auto glass-panel rounded-3xl shadow-2xl p-6 md:p-10 animate-page">
        <button onclick="navigate('blogs-page')" class="flex items-center text-xs font-bold text-slate-300 hover:text-amber-400 mb-6 transition-colors glass-item px-4 py-2 rounded-xl w-fit cursor-pointer">
          <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Blogs Directory
        </button>
        <span class="bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold px-3.5 py-1 rounded-full uppercase tracking-wider">${blog.category}</span>
        <h1 class="text-xl md:text-3xl font-extrabold text-white mt-4 mb-3">${blog.title}</h1>
      </div>
    `;
  }

  if (window.lucide) lucide.createIcons();
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
